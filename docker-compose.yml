services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sportsfolio-network
    # no `ports:` — reachable only from other containers on sportsfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${DOCKERHUB_USER}/sportsfolio-backend:${IMAGE_TAG}
    container_name: sportsfolio-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sportsfolio-network
    # no `ports:` — reachable only via nginx
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # One-off migration job. NOT started by `docker compose up -d`.
  # Run explicitly: docker compose run --rm migrate
  migrate:
    image: ${DOCKERHUB_USER}/sportsfolio-backend:${IMAGE_TAG}
    container_name: sportsfolio-migrate
    environment:
      DATABASE_URL: postgresql://migrate_user:${MIGRATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sportsfolio-network
    profiles:
      - tools
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    build: ./nginx
    container_name: sportsfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"   # the only public entry point on this stack
    depends_on:
      - backend
    networks:
      - sportsfolio-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  sportsfolio-network:
    driver: bridge

volumes:
  postgres-data: